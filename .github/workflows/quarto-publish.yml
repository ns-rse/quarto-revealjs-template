on:
  push:
    branches: main

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book
          tinytex: true
          # uncomment below and fill to pin a version
          # version: 1.2.335

      - name: Install Quarto Extensions
        run: |
          quarto add --no-prompt jmbuhr/quarto-qrcode
          quarto add --no-prompt grantmcdermott/quarto-revealjs-clean
          quarto add --no-prompt ArthurData/quarto-confetti
          quarto add --no-prompt davidwilby/openlinksinnewpage
          quarto add --no-prompt shafayetShafee/reveal-header
          quarto add --no-prompt r-wasm/quarto-drop

      - name: Install and setup uv with python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install package dependencies in activated environment
        shell: bash
        run: |
          uv pip install -e . --group dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
